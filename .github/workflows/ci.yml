# Generated by @deltabox/toolchain — edit dbx.config.* and run `dbx sync`.
name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [release/**, feat/**, feature/**, fix/**, chore/**]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Commitlint (Conventional Commits)
        if: "${{ github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000' }}"
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.event.after }}"
          yarn commitlint --from "$base" --to "$head" --config commitlint.config.mjs
      - name: Verify generated files are in sync
        run: yarn dbx sync --check
      - name: Build
        run: yarn build
      - run: dotnet tool restore
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn clean:rust:if-large
      - run: tsx scripts/cargo.ts test --workspace
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: yarn build:native
      - run: yarn test:csharp
      - run: yarn test:cpp
      - run: yarn test:python
      - run: yarn test:wasm
