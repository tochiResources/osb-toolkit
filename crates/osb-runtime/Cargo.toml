[package]
name = "osb-runtime"
description = "Effect-script runtime: mapset, storyboard, animations, audio and the sprite compositor."
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/tochiResources/osb-toolkit"
authors = ["T0chi"]

[dependencies]
osb-core = { path = "../osb-core" }
thiserror = "2"
rustfft = "6"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
