[package]
name = "osb-sdk"
description = "Generated Rust SDK over the osbTK native bridge (section 5.13, M21): models from the OpenAPI contract, driven by a client over crates/osb-native."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tochiResources/osb-toolkit"
authors = ["T0chi"]

[dependencies]
osb-core = { path = "../osb-core" }
osb-native = { path = "../osb-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = { workspace = true }

[lints]
workspace = true
