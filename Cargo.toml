[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/osb-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/tochiResources/osb-toolkit"
authors = ["T0chi"]

[workspace.dependencies]
thiserror = "2"
rustfft = "6"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
